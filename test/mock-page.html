<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mock 视频站 — 扩展验证页</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
  header {
    height: 56px; background: #232732; color: #fff; display: flex;
    align-items: center; padding: 0 24px; position: sticky; top: 0; z-index: 10;
  }
  header .logo { font-weight: 700; font-size: 18px; }
  header nav { margin-left: 40px; opacity: .8; }
  header nav span { margin-right: 18px; cursor: pointer; }
  .layout { display: flex; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 16px; }
  .main { flex: 1; min-width: 0; }
  .player-wrap {
    background: #000; border-radius: 8px; overflow: hidden;
    aspect-ratio: 16/9; position: relative;
  }
  .player-wrap video { width: 100%; height: 100%; display: block; background: #000; }
  .player-wrap .fake-control {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); display: flex;
    align-items: center; padding: 0 14px; color: #fff; font-size: 12px; gap: 14px;
  }
  .title-bar { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 8px; }
  .next-btn {
    background: #00d2be; color: #06322c; border: 0; border-radius: 6px;
    padding: 6px 16px; font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .comments { background: #fff; border-radius: 8px; padding: 16px; margin-top: 18px; }
  .comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #ccc; flex: none; }
  aside { width: 300px; flex: none; }
  .rec-card {
    background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 12px;
    display: flex; gap: 10px; cursor: pointer;
  }
  .rec-thumb { width: 120px; height: 68px; border-radius: 6px; flex: none; }
  .float-ad {
    position: fixed; right: 16px; bottom: 90px; width: 220px; z-index: 9999;
    background: #fff3cd; border: 1px solid #e0c36a; border-radius: 8px; padding: 10px;
    font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  #ep-badge {
    position: fixed; left: 10px; top: 64px; z-index: 99999; background: rgba(0,0,0,.7);
    color: #0ff; font: 12px/1.4 Consolas, monospace; padding: 6px 10px; border-radius: 6px;
  }
  .status { font: 12px/1.6 Consolas, monospace; background: #22262e; color: #9fe8df; padding: 10px 12px; border-radius: 6px; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header data-noise="1">
  <span class="logo">MockTV</span>
  <nav><span>首页</span><span>剧集</span><span>电影</span><span>综艺</span><span>会员</span></nav>
</header>

<div class="layout">
  <div class="main">
    <div class="player-wrap" id="playerBox">
      <video id="v" playsinline></video>
      <div class="fake-control"><span>▶</span><span id="timeLabel">0:00 / 0:00</span><span>1080P</span><span>1.0x</span></div>
    </div>
    <div class="title-bar">
      <b id="epTitle">第 1 集 · 测试视频</b>
      <button class="next-btn" id="nextBtn">下一集 →</button>
    </div>
    <div class="status" id="status">状态区：等待事件…</div>
    <div class="comments" data-noise="1">
      <h3>评论 (128)</h3>
      <div class="comment"><div class="avatar"></div><div>沙发！这剧太好看了</div></div>
      <div class="comment"><div class="avatar"></div><div>主角演技在线，追了追了</div></div>
      <div class="comment"><div class="avatar"></div><div>求更新快一点！！</div></div>
    </div>
  </div>
  <aside data-noise="1">
    <h3>相关推荐</h3>
    <div class="rec-card"><div class="rec-thumb" style="background:#7ec"></div><div>相关视频标题 1<br><small>12.3万播放</small></div></div>
    <div class="rec-card"><div class="rec-thumb" style="background:#c7e"></div><div>相关视频标题 2<br><small>8.8万播放</small></div></div>
    <div class="rec-card"><div class="rec-thumb" style="background:#ec7"></div><div>相关视频标题 3<br><small>5.1万播放</small></div></div>
    <div class="rec-card"><div class="rec-thumb" style="background:#e77"></div><div>相关视频标题 4<br><small>2.9万播放</small></div></div>
  </aside>
</div>

<div class="float-ad" data-noise="1">📣 悬浮广告：限时会员 5 折！<br><small>（净化模式下应消失）</small></div>
<div id="ep-badge">ep=1 | video duration=…</div>

<script>
/* ---- mock 站自身逻辑（独立于扩展）---- */
(function () {
  const status = document.getElementById('status');
  const log = (msg) => {
    status.textContent = new Date().toLocaleTimeString() + '  ' + msg + '\n' + status.textContent.split('\n').slice(0, 8).join('\n');
    console.log('[mock]', msg);
  };

  let ep = 1;
  try { ep = Math.max(1, +new URLSearchParams(location.search).get('ep') || 1); } catch (e) {}

  /* 生成 4 秒测试视频（canvas → MediaRecorder → blob） */
  const canvas = document.createElement('canvas');
  canvas.width = 640; canvas.height = 360;
  const ctx = canvas.getContext('2d');
  let blobUrl = null;

  function drawFrame(t, dur) {
    const p = t / dur;
    ctx.fillStyle = '#101820';
    ctx.fillRect(0, 0, 640, 360);
    // 移动的圆 = 进度可视化
    const grad = ctx.createLinearGradient(0, 0, 640 * p, 0);
    grad.addColorStop(0, '#00d2be'); grad.addColorStop(1, '#2b6cff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 150, 640 * p, 60);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('EP ' + ep, 320, 130);
    ctx.font = '20px sans-serif';
    ctx.fillText(t.toFixed(2) + 's / ' + dur + 's', 320, 260);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('片头=1s 片尾=1s（用于验证跳过）', 320, 300);
  }

  function makeVideo() {
    return new Promise((resolve) => {
      const dur = 4; // 秒
      const stream = canvas.captureStream(25);
      const rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm' });
      const chunks = [];
      const t0 = performance.now();
      (function frame() {
        const el = (performance.now() - t0) / 1000;
        if (el < dur) {
          drawFrame(el, dur);
          requestAnimationFrame(frame);
        }
      })();
      rec.ondataavailable = (e) => chunks.push(e.data);
      rec.onstop = () => {
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
        resolve(blobUrl);
      };
      rec.start();
      setTimeout(() => rec.stop(), dur * 1000);
    });
  }

  const video = document.getElementById('v');

  function fixDuration(v) {
    // webm blob 常见 duration=Infinity 的 workaround
    return new Promise((resolve) => {
      if (isFinite(v.duration) && v.duration > 0) return resolve(v.duration);
      const onSeeked = () => {
        v.removeEventListener('seeked', onSeeked);
        const d = v.duration;
        v.currentTime = 0;
        resolve(isFinite(d) ? d : 4);
      };
      v.addEventListener('seeked', onSeeked);
      v.currentTime = 1e101;
    });
  }

  async function loadEpisode() {
    if (!blobUrl) blobUrl = await makeVideo();
    video.src = blobUrl;
    video.load();
    await new Promise((r) => (video.onloadedmetadata = r));
    const dur = await fixDuration(video);
    document.getElementById('epTitle').textContent = '第 ' + ep + ' 集 · 测试视频';
    document.getElementById('ep-badge').textContent = 'ep=' + ep + ' | duration=' + dur.toFixed(2);
    log('第 ' + ep + ' 集加载完成 duration=' + dur.toFixed(2));
    video.play().catch(() => log('自动播放被阻止，请手动点击播放'));
  }

  // 「下一集」：模拟 SPA 切集（pushState + 重播）
  document.getElementById('nextBtn').addEventListener('click', () => {
    ep += 1;
    history.pushState({}, '', '?ep=' + ep);
    loadEpisode();
    log('点击下一集 → pushState ?ep=' + ep);
  });

  // 事件记录（验证扩展行为）
  ['play', 'pause', 'ended', 'seeked', 'loadedmetadata'].forEach((ev) => {
    video.addEventListener(ev, () => {
      log('video.' + ev + ' @ t=' + video.currentTime.toFixed(2) +
        (video.duration && isFinite(video.duration) ? ' / ' + video.duration.toFixed(2) : ''));
    });
  });
  setInterval(() => {
    document.getElementById('timeLabel').textContent =
      video.currentTime.toFixed(1) + ' / ' + (isFinite(video.duration) ? video.duration.toFixed(1) : '?');
  }, 200);

  window.addEventListener('popstate', () => {
    try { ep = Math.max(1, +new URLSearchParams(location.search).get('ep') || 1); } catch (e) {}
    loadEpisode();
  });

  loadEpisode();
})();
</script>
</body>
</html>
